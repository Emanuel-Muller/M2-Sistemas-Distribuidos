// ns3: secundário autoritativo (roteiro, p.12-13)
options {
    directory "/var/bind";
    recursion no;
    allow-query { any; };
    // permite timers curtos no laboratório
    min-refresh-time 10;
    min-retry-time 5;
};

zone "sd.lab" {
    type secondary;
    primaries { 172.30.0.11; };
    file "db.sd.lab";
};
