// ns1 na variante da Ênfase B (E9): igual ao named.conf do ns1,
// acrescido das chaves TSIG e da política de atualização dinâmica.
// Usado SOMENTE com docker-compose.e9.yml. Ver README.md, "Adaptações em relação ao roteiro" (A7).
include "/etc/bind/chaves/cliente1.key";
include "/etc/bind/chaves/cliente2.key";

options {
    directory "/var/bind";
    recursion no;
    allow-query { any; };
    notify yes;
    also-notify { 172.30.0.12; 172.30.0.13; };
    allow-transfer { 172.30.0.12; 172.30.0.13; };
};

zone "sd.lab" {
    type primary;
    file "/var/lib/bind/db.sd.lab";
    // [ADAPTAÇÃO A8] A zona do laboratório é minúscula: sem esta linha, o BIND
    // troca IXFR por AXFR quando a soma das mudanças passa do tamanho da zona.
    max-ixfr-ratio unlimited;
    // RFC 2136 + TSIG: só quem tem uma das chaves pode alterar a zona
    update-policy {
        grant cliente1 zonesub ANY;
        grant cliente2 zonesub ANY;
    };
};
