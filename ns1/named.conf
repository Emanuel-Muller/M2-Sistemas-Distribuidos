// ns1: primário autoritativo da zona sd.lab (roteiro, p.12)
options {
    directory "/var/bind";
    recursion no;
    allow-query { any; };
    notify yes;
    also-notify { 172.30.0.12; 172.30.0.13; };
    allow-transfer { 172.30.0.12; 172.30.0.13; };
};

zone "sd.lab" {
    type primary;
    file "/var/lib/bind/db.sd.lab";
};
