// ns1 na variante SEM NOTIFY (E3, segunda série): igual ao named.conf do ns1,
// trocando "notify yes" por "notify no". Usado só com docker-compose.sem-notify.yml.
options {
    directory "/var/bind";
    recursion no;
    allow-query { any; };
    notify no;
    also-notify { 172.30.0.12; 172.30.0.13; };
    allow-transfer { 172.30.0.12; 172.30.0.13; };
};

zone "sd.lab" {
    type primary;
    file "/var/lib/bind/db.sd.lab";
};
